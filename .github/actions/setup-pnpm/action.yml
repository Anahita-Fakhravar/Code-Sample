name: 'Setup Node + pnpm'
description: 'Sets up Node.js, Corepack, and pnpm correctly'

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '22'

runs:
  using: 'composite'

  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Activate pnpm
      shell: bash
      run: corepack prepare pnpm@10 --activate

    - name: Verify pnpm
      shell: bash
      run: pnpm -v

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
